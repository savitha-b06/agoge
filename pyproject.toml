[project]
name = "agoge"
version = "0.1.0"
description = "A training agent that remembers you. COROS data in, coaching out."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40.0",
  "mcp>=1.2.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1.0"]

[project.scripts]
agoge = "agoge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
